name: iPhone build and simulator tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(python3 -c 'import glob; paths=sorted(glob.glob("/Applications/Xcode_26*.app")); print(paths[-1] if paths else "/Applications/Xcode.app")')
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - run: npm test
      - name: Build unsigned iPhone app
        run: xcodebuild -project ios/Ebrusim.xcodeproj -scheme Ebrusim -configuration Debug -destination 'generic/platform=iOS' -derivedDataPath ios/build/device CODE_SIGNING_ALLOWED=NO build
      - name: Find iPhone simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for devices in d["devices"].values() for v in devices if v["name"].startswith("iPhone")))')
          echo "EBRU_SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
      - name: Test gallery storage and iPhone interface
        run: xcodebuild -project ios/Ebrusim.xcodeproj -scheme Ebrusim -configuration Debug -destination "platform=iOS Simulator,id=$EBRU_SIMULATOR_ID" -derivedDataPath ios/build/simulator -resultBundlePath ios/build/Ebrusim.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Package unsigned iPhone build
        if: success()
        run: |
          mkdir -p ios/build/Payload
          cp -R ios/build/device/Build/Products/Debug-iphoneos/Ebrusim.app ios/build/Payload/
          cd ios/build
          zip -qr Ebrusim_Unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ebrusim-iphone
          path: |
            ios/build/Ebrusim_Unsigned.ipa
            ios/build/Ebrusim.xcresult
          if-no-files-found: warn
