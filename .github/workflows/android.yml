name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EBRUSIM_PREVIEW_KEYSTORE: ${{ github.workspace }}/android/preview-debug.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: npm test
      - name: Preserve preview signing identity for future updates
        uses: actions/cache@v4
        with:
          path: android/preview-debug.keystore
          key: ebrusim-preview131-debug-key-v1
      - name: Create preview debug key when cache is empty
        shell: bash
        run: |
          if [ ! -f "$EBRUSIM_PREVIEW_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$EBRUSIM_PREVIEW_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installable APK and unsigned Play bundle
        working-directory: android
        run: ./gradlew assembleDebug bundleRelease lint --no-daemon
      - name: Show lint diagnostics on failure
        if: failure()
        run: cat android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ebrusim-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/reports/lint-results-*.html
          if-no-files-found: error
